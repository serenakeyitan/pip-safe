name: CI

on:
  push:
    branches: [main, initial-build]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src/

      - name: Run tests
        run: pytest tests/ -v --cov=pip_safe --cov-report=term-missing

  security-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-safe
        run: pip install -e .

      - name: Self-audit
        run: pip-safe audit --requirements requirements-dev.txt || true
