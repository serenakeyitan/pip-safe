[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pip-safe"
version = "0.1.0"
description = "PyPI package security scanner — detect supply chain attacks before they happen"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "serenakeyitan"}]
keywords = ["security", "pypi", "supply-chain", "audit", "scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
    "packaging>=23.0",
]

[project.scripts]
pip-safe = "pip_safe.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
